events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- HTTP: redirect to HTTPS + ACME challenge ---
    server {
        listen 80;
        server_name brunorag.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: serve React SPA, proxy /search to Node ---
    server {
        listen 443 ssl;
        server_name brunorag.com;

        ssl_certificate     /etc/letsencrypt/live/brunorag.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/brunorag.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location /search {
            set $upstream http://app:3000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
